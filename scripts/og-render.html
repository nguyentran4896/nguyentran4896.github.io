<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#1A1A1A; --fg:#F4F3EE; --muted:#8B8B86; --accent:#3B5CFF; --hair:rgba(244,243,238,0.14); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#000; }
  #card {
    width:1200px; height:630px;
    background:var(--bg);
    position:relative; overflow:hidden;
    padding:72px 80px;
    display:flex; flex-direction:column; justify-content:space-between;
    font-family:"Geist Mono", ui-monospace, monospace;
  }
  /* faint corner glow to echo the site's accent, very subtle */
  #card::after {
    content:""; position:absolute; right:-160px; bottom:-160px;
    width:520px; height:520px; border-radius:9999px;
    background:radial-gradient(circle, rgba(59,92,255,0.16), transparent 62%);
    pointer-events:none;
  }
  .eyebrow {
    font-size:22px; font-weight:500; letter-spacing:0.32em; text-transform:uppercase;
    color:var(--muted); display:flex; align-items:center; gap:16px; position:relative; z-index:1;
  }
  .eyebrow .dot { width:12px; height:12px; border-radius:9999px; background:var(--accent); display:inline-block; }
  .title {
    font-family:"Playfair Display", Georgia, serif; font-style:italic; font-weight:500;
    color:var(--fg); font-size:76px; line-height:1.06; letter-spacing:-0.01em;
    max-width:1000px; position:relative; z-index:1;
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
  }
  .title.small { font-size:64px; }
  .meta {
    display:flex; align-items:center; gap:20px; position:relative; z-index:1;
    font-size:21px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted);
  }
  .meta .tags { color:var(--accent); }
  .meta .sep { color:rgba(244,243,238,0.22); }
  .footer {
    display:flex; align-items:center; gap:20px; position:relative; z-index:1;
    padding-top:26px; border-top:1px solid var(--hair);
    font-size:20px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted);
  }
  .footer .mono-n { font-family:"Playfair Display", serif; font-style:italic; font-weight:600; text-transform:none; color:var(--fg); font-size:26px; }
  .footer .spacer { flex:1; }
</style>
</head>
<body>
  <div id="card">
    <div class="eyebrow"><span class="dot"></span><span id="eyebrow-text">Nguyen Tran · Writing</span></div>
    <h1 class="title" id="title">Title</h1>
    <div>
      <div class="meta" id="meta"></div>
      <div class="footer">
        <span class="mono-n">N<span style="color:var(--accent)">.</span></span>
        <span class="spacer"></span>
        <span>nguyentran4896.github.io</span>
      </div>
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const title = q.get("title") || "Untitled";
    const tags = (q.get("tags") || "").split(",").map(s=>s.trim()).filter(Boolean);
    const date = q.get("date") || "";
    const read = q.get("read") || "";
    const tEl = document.getElementById("title");
    tEl.textContent = title;
    if (title.length > 46) tEl.classList.add("small");
    const meta = document.getElementById("meta");
    const parts = [];
    if (date) parts.push(`<span>${date}</span>`);
    if (read) parts.push(`<span class="sep">/</span><span>${read}</span>`);
    if (tags.length) parts.push(`<span class="sep">/</span><span class="tags">${tags.join(" · ")}</span>`);
    meta.innerHTML = parts.join(" ");
    window.__ogReady = false;
    Promise.all([
      document.fonts.load('italic 500 76px "Playfair Display"'),
      document.fonts.load('500 22px "Geist Mono"'),
    ]).then(() => document.fonts.ready).then(() => { window.__ogReady = true; });
  </script>
</body>
</html>
